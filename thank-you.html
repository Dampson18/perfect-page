<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Perfect Page Freight Logistics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    
    <style>
        .thank-you-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 100%);
        }
        
        .thank-you-card {
            max-width: 520px;
            width: 100%;
            background: var(--white);
            padding: 60px 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            text-align: center;
            border: 1px solid var(--gray-200);
            animation: slideUp 0.6s ease forwards;
            opacity: 0;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .thank-you-card .icon-wrapper {
            width: 80px;
            height: 80px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        
        .thank-you-card .icon-wrapper i {
            font-size: 40px;
            color: var(--success);
        }
        
        .thank-you-card h1 {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-dark);
            margin-bottom: 12px;
        }
        
        .thank-you-card p {
            color: var(--gray-600);
            line-height: 1.8;
            margin-bottom: 8px;
        }
        
        .thank-you-card .highlight-text {
            color: var(--primary-light);
            font-weight: 600;
        }
        
        .thank-you-card .response-time {
            background: var(--off-white);
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            margin: 20px 0 30px;
            display: inline-block;
        }
        
        .thank-you-card .response-time i {
            color: var(--primary-light);
            margin-right: 8px;
        }
        
        .thank-you-card .response-time span {
            font-size: 14px;
            color: var(--gray-600);
        }
        
        .thank-you-card .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        @media (max-width: 480px) {
            .thank-you-card {
                padding: 40px 24px;
            }
            
            .thank-you-card h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="thank-you-page">
        <div class="thank-you-card">
            <div class="icon-wrapper">
                <i class="fas fa-check-circle"></i>
            </div>
            
            <h1>Thank You!</h1>
            <p>Your message has been sent successfully to</p>
            <p><strong class="highlight-text">Perfect Page Freight Logistics</strong></p>
            
            <div class="response-time">
                <i class="fas fa-clock"></i>
                <span>We'll respond within <strong>24 hours</strong></span>
            </div>
            
            <p style="font-size: 14px; color: var(--gray-400);">
                A confirmation has been sent to your email address.
            </p>
            
            <div class="btn-group" style="margin-top: 28px;">
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-home"></i> Return Home
                </a>
                <a href="quote.html" class="btn btn-secondary">
                    <i class="fas fa-paper-plane"></i> Another Quote
                </a>
            </div>
            
            <p style="margin-top: 24px; font-size: 13px; color: var(--gray-400);">
                <i class="fas fa-phone"></i> Need immediate help? Call us at 
                <a href="tel:+233245359395" style="color: var(--primary-light); font-weight: 600;">+233 24 535 9395</a>
            </p>
        </div>
    </div>
</body>
</html>
